name: Bug 报告
description: 报告可以稳定复现的问题
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: 感谢反馈。提交前请确认没有在内容或日志中包含 API Key、Cookie 或个人数据。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？你原本期待什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: 版本或 commit
      placeholder: 例如 main@abcdef0
  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: 例如 Windows 11 / Python 3.12 / Node.js 24 / Chrome
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请先删除密钥、Cookie、路径和其他敏感信息。
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未发现重复报告。
          required: true
        - label: 我已移除所有密钥和个人数据。
          required: true
